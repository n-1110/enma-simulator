<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#211a34"><title>期末の振り返り | 閻魔大王シミュレータ</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="review">
<header class="site-header">
  <div class="brand"><span class="brand-mark">閻</span><div class="brand-name">地獄庁 <span>／ 閻魔大王シミュレータ</span></div></div>
  <nav class="top-actions"><button class="pixel-button small hidden" id="sandboxSettingsButton" onclick="EnmaUI.openSandboxSettings()">設定</button><button class="pixel-button small" onclick="EnmaUI.openSave(false)">セーブ・ロード</button><button class="pixel-button small" onclick="EnmaUI.openCollection()">行いの記録</button><button class="pixel-button small" onclick="EnmaUI.openHelp('review')">説明</button><button class="pixel-button small" onclick="EnmaUI.showCredits()">クレジット</button><button class="pixel-button small" onclick="EnmaUI.backToTitle()">タイトルに戻る</button></nav>
</header>
<main class="review-main">
  <div class="page-title review-page-title"><div class="eyebrow">PERIOD REVIEW</div><h1 id="reviewTitle">第一期・振り返り</h1><p id="reviewIntro">この期の裁判を振り返ります。</p></div>
  <div class="review-layout">
    <div class="review-left">
      <section class="pixel-frame review-panel">
        <div class="review-panel-heading"><h2>獄卒からの評価</h2></div>
        <p><span class="review-rating" id="staffEvaluationLabel">おおむね良好</span></p>
        <p id="staffEvaluationText" class="review-staff-text"></p>
        <div class="review-stats" id="reviewStats"></div>
        <div class="ai-comment review-ai"><strong class="ai-name"><img src="assets/enma-ai.svg" alt=""><span class="review-ai-text">閻魔AI</span></strong>
          <br><span id="reviewAI"></span></div>
      </section>
    </div>
    <section class="pixel-frame review-panel hell-review-panel">
      <div class="review-panel-heading"><h2>地獄の混雑状況</h2></div>
      <p class="muted small-text hell-report-help">各地獄をクリックすると、収容区画の様子を確認できます。</p>
      <div class="hell-list" id="hellReport"></div>
    </section>
  </div>
  <div class="row between review-next-row"><span class="muted small-text" id="reviewNextText">次の期へ進みます。</span><div class="button-row"><button class="pixel-button" onclick="EnmaUI.openJudgementHistory()">判決履歴を見る</button><button class="pixel-button primary" id="nextPeriodButton" onclick="EnmaUI.nextPeriod()">次の期へ</button></div></div>
</main>
<footer class="site-footer">期末報告は閻魔AIが自動で作成しています。内容の正確性は保証されません。</footer>
<div class="modal-back" id="modalBack" onclick="if(event.target===this && this.dataset.locked !== '1')EnmaUI.closeModal()"><div class="modal" id="modal"></div></div>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/storage.js"></script><script src="js/game.js"></script><script src="js/ui.js"></script>
</body></html>
