<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#211a34"><title>ゲームオーバー | 閻魔大王シミュレータ</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="gameover">
<header class="site-header"><div class="brand"><span class="brand-mark">閻</span><div class="brand-name">地獄庁 <span>／ 閻魔大王シミュレータ</span></div></div><nav class="top-actions"><button class="pixel-button small" onclick="EnmaUI.openCollection()">行いの記録</button><button class="pixel-button small" onclick="EnmaUI.showCredits()">クレジット</button><button class="pixel-button small" onclick="EnmaUI.backToTitle()">タイトルに戻る</button></nav></header>
<main class="page-center"><section class="pixel-frame gameover-card stack"><div class="seal">終</div><div class="eyebrow">GAME OVER</div><h1 id="gameoverTitle">地獄の管理に失敗しました</h1><p id="gameoverReason"></p><div class="ai-comment"><strong class="ai-name"><img src="assets/enma-ai.svg" alt=""><span>閻魔AI：</span></strong><span id="gameoverAI"></span></div><div class="button-row" style="justify-content:center"><button class="pixel-button primary" onclick="EnmaUI.startNewGame()">最初からやり直す</button><button class="pixel-button" onclick="EnmaUI.backToTitle()">タイトルへ戻る</button></div></section></main>
<footer class="site-footer">地獄庁からのお知らせ：新しい閻魔大王を募集中です。</footer>
<div class="modal-back" id="modalBack" onclick="if(event.target===this && this.dataset.locked !== '1')EnmaUI.closeModal()"><div class="modal" id="modal"></div></div>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/storage.js"></script><script src="js/game.js"></script><script src="js/ui.js"></script>
</body></html>
