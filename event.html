<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#211a34"><title>獄卒イベント | 閻魔大王シミュレータ</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="event">
<header class="site-header">
  <div class="brand"><span class="brand-mark">閻</span><div class="brand-name">地獄庁 <span>／ 閻魔大王シミュレータ</span></div></div>
  <nav class="top-actions">
    <button class="pixel-button small" onclick="EnmaUI.openSave(false)">セーブ・ロード</button>
    <button class="pixel-button small" onclick="EnmaUI.openCollection()">行いの記録</button>
    <button class="pixel-button small" onclick="EnmaUI.openHelp('event')">説明</button>
    <button class="pixel-button small" onclick="EnmaUI.showCredits()">クレジット</button>
    <button class="pixel-button small" onclick="EnmaUI.backToTitle()">タイトルに戻る</button>
    
  </nav>
</header>
<main class="event-main">
  <div class="event-topline"><div><div class="eyebrow" id="eventPeriod">第一期</div><h1>獄卒からの相談</h1></div><span class="case-tag">STAFF EVENT</span></div>
  <section class="pixel-frame staff-event-card">
    <div class="staff-speaker-row">
      <div class="staff-avatar" aria-hidden="true"><img src="assets/ogre.svg" alt=""></div>
      <div><div class="eyebrow">相談者</div><h2 id="eventSpeaker">第一地獄担当の獄卒</h2></div>
    </div>
    <div class="staff-event-body">
      <h3 id="eventTitle">第一地獄が静かすぎる</h3>
      <p id="eventText"></p>
    </div>
    <div id="eventChoices" class="event-choices"></div>
    <div id="eventResult" class="event-result hidden">
      <div class="event-reaction-label">獄卒の反応</div>
      <p id="eventReaction" class="event-reaction"></p>
      <p id="eventResultText" class="event-result-text"></p>
      <p id="eventEffectText" class="event-effect-text"></p>
      <div class="ai-comment event-ai-comment"><strong class="ai-name"><img src="assets/enma-ai.svg" alt=""><span>閻魔AI：</span></strong><span id="eventAIText"></span></div>
    </div>
    <div class="event-footer"><button class="pixel-button primary hidden" id="eventContinue" onclick="EnmaUI.continueFromStaffEvent()">振り返りへ</button></div>
  </section>
</main>
<div class="modal-back" id="modalBack" onclick="if(event.target===this && this.dataset.locked !== '1')EnmaUI.closeModal()"><div class="modal" id="modal"></div></div>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/content.js"></script><script src="js/storage.js"></script><script src="js/game.js"></script><script src="js/ui.js"></script>
</body></html>
